# ==============================================================================
# Pekko gRPC Starter Default Configuration (reference.conf)
# Automatically discovered and inherited by downstream microservices.
# Downstream services override only what differs in their application.conf.
# ==============================================================================

grpc {
  server {
    host = "0.0.0.0"
    host = ${?GRPC_HOST}

    port = 3030
    port = ${?GRPC_PORT}
  }
}

pekko {
  # Default loglevel
  loglevel = "INFO"
  loglevel = ${?LOG_LEVEL}

  # Enable HTTP/2 for gRPC cleartext (h2c) transport
  http {
    server {
      preview {
        enable-http2 = on
      }
    }
  }
}
